name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: plugin + KiriPanel.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the plugin (x86 + x64)
        run: plugin\native\build.bat

      - name: Unit tests
        run: python -m unittest discover -s pc/tests

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Pack the player's download
        run: |
          mkdir dist\3ds
          python pc\build.py --zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/KiriPanel-*.zip
          if-no-files-found: error

  console:
    name: 3DS app
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the toolchain image
        run: docker build --network=host -t moonlight-n3ds console/moonlight-n3ds

      - name: Build the console app
        run: docker run --rm -v "$PWD/console/moonlight-n3ds:/moonlight-N3DS" -w /moonlight-N3DS moonlight-n3ds:latest make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-3ds
          path: |
            console/moonlight-n3ds/moonlight.3dsx
            console/moonlight-n3ds/moonlight.cia
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [windows, console]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release-windows/*.zip
            dist/release-3ds/moonlight.3dsx
            dist/release-3ds/moonlight.cia
          generate_release_notes: true
